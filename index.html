<!doctype html>
<html lang="en" data-theme="dark" data-font-scale="100" data-vision="default">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Cinerama — Central Operating System for Cinema Management" />
    <title>Cinerama — Cinema OS</title>
    <script>
      // Aplica las preferencias de accesibilidad guardadas ANTES del primer
      // pintado, para evitar el parpadeo de tema/letra/visión al cargar.
      // Si no hay nada guardado, respeta prefers-color-scheme del sistema.
      (function () {
        var html = document.documentElement;
        try {
          var saved = JSON.parse(localStorage.getItem('cinerama-a11y') || 'null');
          var theme = saved && saved.theme;
          if (!theme) {
            theme = window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches
              ? 'light'
              : 'dark';
          }
          html.setAttribute('data-theme', theme);
          html.setAttribute('data-font-scale', String((saved && saved.fontScale) || 100));
          html.setAttribute('data-vision', (saved && saved.vision) || 'default');
        } catch (e) {
          // localStorage inaccesible (modo privado, etc.): se queda con los
          // valores por defecto ya presentes en el <html>.
        }
      })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=Montserrat:wght@700;800;900&family=Poppins:wght@600;700;800;900&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
